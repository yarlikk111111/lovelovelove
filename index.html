<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>План на неділю ✨</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; padding: 15px; }
        .card-container { background: white; padding: 35px 25px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); width: 100%; max-width: 420px; text-align: center; }
        .tab-headers { display: flex; justify-content: center; gap: 12px; margin-bottom: 25px; }
        .tab-link { padding: 8px 18px; border-radius: 20px; background: #f1f2f6; font-size: 14px; font-weight: 600; color: #a4b0be; transition: all 0.3s ease; }
        .tab-link.active { background: #6c5ce7; color: white; box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
        h2 { font-size: 22px; margin-bottom: 20px; color: #2d3436; }
        
        /* Кнопки ТАК / НІ */
        .options-group { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .option-box { position: relative; width: 110px; height: 90px; }
        .option-box input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
        .square { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; background: #f8f9fa; border: 2px solid #dfe4ea; border-radius: 16px; font-size: 18px; font-weight: bold; color: #57606f; cursor: pointer; transition: all 0.2s ease; user-select: none; }
        #yesInput:checked ~ .square { background: #e8f4fd; border-color: #2196F3; color: #2196F3; transform: scale(1.03); box-shadow: 0 6px 16px rgba(33, 150, 243, 0.25); }
        #noInput:checked ~ .square { background: #ffeaa7; border-color: #ff7675; color: #d63031; transform: scale(1.03); box-shadow: 0 6px 16px rgba(214, 48, 49, 0.25); }
        
        .select-wrapper { display: flex; flex-direction: column; gap: 16px; margin-bottom: 25px; text-align: left; }
        .select-wrapper label { font-size: 13px; font-weight: 700; color: #8395a7; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .custom-select { width: 100%; padding: 12px 16px; border: 2px solid #dfe4ea; border-radius: 14px; font-size: 15px; font-weight: 600; color: #2d3436; outline: none; transition: all 0.2s; background: #f8f9fa; cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg fill='%236c5ce7' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>"); background-repeat: no-repeat; background-position: right 14px center; }
        .custom-select:focus { border-color: #6c5ce7; background-color: #fff; box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.12); }

        /* Нова сітка вибору часу (Time Chips) */
        .time-chips-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .time-chip { background: #f8f9fa; border: 2px solid #dfe4ea; border-radius: 12px; padding: 10px 0; font-size: 15px; font-weight: 700; color: #57606f; cursor: pointer; text-align: center; transition: all 0.2s ease; user-select: none; }
        .time-chip:hover { border-color: #a29bfe; background: #f1f0fe; }
        .time-chip.active { background: #6c5ce7; border-color: #6c5ce7; color: white; box-shadow: 0 4px 12px rgba(108, 92, 231, 0.35); transform: translateY(-1px); }

        .submit-btn { background: #6c5ce7; color: white; border: none; padding: 14px; font-size: 16px; font-weight: 600; border-radius: 20px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 6px 18px rgba(108, 92, 231, 0.3); width: 100%; }
        .submit-btn:hover { background: #5b4cc4; transform: translateY(-2px); }
        .submit-btn:disabled { background: #a29bfe; cursor: not-allowed; transform: none; }
        .status-icon { font-size: 60px; margin-bottom: 15px; }
        .heart-animation { animation: heartBeat 1.2s infinite; }
        .error-animation { animation: shake 0.5s ease-in-out; }
        .success-title { color: #00b894; font-size: 26px; font-weight: 700; }
        .error-title { color: #d63031; font-size: 24px; font-weight: 700; }
        .error-btn { background: #dfe4ea; color: #57606f; margin-top: 20px; box-shadow: none; }
        .error-btn:hover { background: #b2bec3; color: white; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes heartBeat { 0%, 28%, 70% { transform: scale(1); } 14%, 42% { transform: scale(1.1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="tab-headers">
            <span class="tab-link active" id="header1">Запитання</span>
            <span class="tab-link" id="header2">Результат</span>
        </div>

        <form action="https://formsubmit.co/yaroslav.lukashchukk@gmail.com" method="POST" id="mainForm" onsubmit="handleFormSubmit(event)">
            
            <input type="hidden" name="_subject" value="Нова відповідь на запрошення! 🎉">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="Обраний час" id="finalTimeInput" value="19:00">

            <div class="tab-content active" id="content1">
                <h2>Чи будемо ми гуляти в неділю? 😊</h2>
                
                <div class="options-group">
                    <label class="option-box">
                        <input type="radio" name="Рішення" id="yesInput" value="Так! 😍 Йдемо гуляти!" checked>
                        <span class="square">Так</span>
                    </label>
                    
                    <label class="option-box">
                        <input type="radio" name="Рішення" id="noInput" value="Спроба натиснути Ні 😢">
                        <span class="square">Ні</span>
                    </label>
                </div>

                <button type="button" class="submit-btn" id="btnStep1" onclick="processFirstStep()">Підтвердити</button>
            </div>

            <div class="tab-content" id="contentDateTime">
                <h2>Коли тобі зручно? 📅</h2>
                
                <div class="select-wrapper">
                    <label for="daySelect">Обери день:</label>
                    <select name="Обраний день" id="daySelect" class="custom-select"></select>

                    <label>Обери час:</label>
                    <div class="time-chips-grid" id="timeChipsGrid">
                        <!-- Динамічно згенеровані кнопки часу -->
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="btnSubmit">Надіслати відповідь</button>
            </div>
        </form>

        <div class="tab-content" id="contentSuccess">
            <div class="status-icon heart-animation">❤️</div>
            <h2 class="success-title">Скоро побачимось!</h2>
            <p style="color: #636e72; margin-top: 10px;">&lt;3 ✨</p>
        </div>

        <div class="tab-content" id="contentError">
            <div class="status-icon error-animation">❌</div>
            <h2 class="error-title">Ууупс... Виникла помилка!</h2>
            <p style="color: #636e72; margin-top: 10px;">Ця кнопка заблокована провайдером. Спробуйте інший варіант відповіді 😜</p>
            <button class="submit-btn error-btn" onclick="goBack()">Назад до вибору</button>
        </div>
    </div>
        
    <script>
        function generateDayOptions() {
            const select = document.getElementById('daySelect');
            select.innerHTML = '';
            const daysNames = ['Неділя', 'Понеділок', 'Вівторок', 'Середа', 'Четвер', "П'ятниця", 'Субота'];
            const today = new Date();

            for (let i = 0; i < 7; i++) {
                const targetDate = new Date();
                targetDate.setDate(today.getDate() + i);

                const dayName = daysNames[targetDate.getDay()];
                const dayNum = String(targetDate.getDate()).padStart(2, '0');
                const monthNum = String(targetDate.getMonth() + 1).padStart(2, '0');

                const optionText = `${dayName}, ${dayNum}.${monthNum}`;
                const option = document.createElement('option');
                option.value = optionText;
                option.textContent = optionText;

                if (dayName === 'Неділя') {
                    option.selected = true;
                }
                select.appendChild(option);
            }
        }

        // Список найбільш популярного часу для виключення складних випадаючих вікон
        const popularTimes = ['14:00', '15:30', '17:00', '18:30', '19:00', '20:00'];

        function initTimeChips() {
            const grid = document.getElementById('timeChipsGrid');
            grid.innerHTML = '';

            popularTimes.forEach(time => {
                const chip = document.createElement('div');
                chip.className = 'time-chip';
                chip.textContent = time;

                if (time === '19:00') {
                    chip.classList.add('active');
                }

                chip.onclick = function() {
                    document.querySelectorAll('.time-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    document.getElementById('finalTimeInput').value = time;
                };

                grid.appendChild(chip);
            });
        }

        generateDayOptions();
        initTimeChips();

        function processFirstStep() {
            const isYesSelected = document.getElementById('yesInput').checked;
            if (isYesSelected) {
                document.getElementById('content1').classList.remove('active');
                document.getElementById('contentDateTime').classList.add('active');
            } else {
                sendDataAndSwitch(false);
            }
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            sendDataAndSwitch(true);
        }

        function sendDataAndSwitch(isSuccess) {
            const form = document.getElementById('mainForm');
            const submitBtn = document.getElementById('btnSubmit');
            const step1Btn = document.getElementById('btnStep1');
            
            submitBtn.disabled = true;
            step1Btn.disabled = true;

            fetch(form.action, {
                method: "POST",
                body: new FormData(form)
            })
            .then(() => { switchInterfaceToTabs(isSuccess); })
            .catch((error) => {
                console.error("Помилка відправки:", error);
                switchInterfaceToTabs(isSuccess);
            })
            .finally(() => {
                submitBtn.disabled = false;
                step1Btn.disabled = false;
            });
        }

        function switchInterfaceToTabs(isSuccess) {
            document.getElementById('content1').classList.remove('active');
            document.getElementById('contentDateTime').classList.remove('active');
            document.getElementById('header1').classList.remove('active');
            document.getElementById('header2').classList.add('active');

            if (isSuccess) {
                document.getElementById('contentSuccess').classList.add('active');
            } else {
                document.getElementById('contentError').classList.add('active');
            }
        }

        function goBack() {
            document.getElementById('contentError').classList.remove('active');
            document.getElementById('contentDateTime').classList.remove('active');
            document.getElementById('content1').classList.add('active');
            document.getElementById('header2').classList.remove('active');
            document.getElementById('header1').classList.add('active');
            document.getElementById('yesInput').checked = true;
        }
    </script>
</body>
</html>
